<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bichitos en Ruta</title>
<meta name="description" content="Juego de puertas y bichitos para el navegador">
<meta name="theme-color" content="#1b1440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1b1440; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif; color: #fff; }
  #wrap { position: relative; overflow: hidden; border-radius: 0.6em; box-shadow: 0 0 40px rgba(0,0,0,.5); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hidden { display: none !important; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6em; padding: 1em; background: rgba(22, 12, 60, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); text-align: center; }
  h1 { margin: 0; font-size: 3.2em; line-height: .95; color: #ffe14d; text-shadow: 0 .08em 0 #c2410c, 0 .16em 0 #1b1340, 0 0 .4em rgba(0,0,0,.4); letter-spacing: .02em; }
  h1 span { color: #8fd8ff; text-shadow: 0 .08em 0 #1d5fa8, 0 .16em 0 #1b1340; }
  h2 { margin: 0 0 .3em; font-size: 2.1em; color: #ffe14d; text-shadow: 0 .1em 0 #1b1340; }
  .sub { margin: .4em 0 0; font-size: 1.1em; font-weight: 700; }
  .tip { margin: 0; font-size: .75em; opacity: .9; max-width: 22em; }
  button { font-family: inherit; color: #fff; border: none; cursor: pointer; }
  .big, .overlay button.std { font-size: 1.5em; font-weight: 900; padding: .45em 1.6em; border-radius: 1em; background: linear-gradient(#ffcf3d, #ff9a1f); color: #5a2a00; box-shadow: 0 .2em 0 #b45309, 0 .35em .6em rgba(0,0,0,.35); }
  .big:active { transform: translateY(.12em); box-shadow: 0 .08em 0 #b45309; }
  .row { display: flex; gap: .6em; }
  .row button, #btnBack, #btnQuit { font-size: 1.05em; font-weight: 800; padding: .5em 1.2em; border-radius: .9em; background: #4a3a9a; box-shadow: 0 .18em 0 #261a66; }
  .partners { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45em; width: 100%; max-width: 21em; }
  .partner { background: rgba(255,255,255,.12); border-radius: .8em; padding: .2em .2em .35em; border: .15em solid transparent; display: flex; flex-direction: column; align-items: center; }
  .partner canvas { width: 4.2em; height: 4.2em; }
  .partner.sel { border-color: #ffe14d; background: color-mix(in srgb, var(--c) 45%, transparent); transform: scale(1.05); }
  .diffrow { display: flex; gap: .4em; }
  .diff { font-size: .85em; font-weight: 800; padding: .35em .9em; border-radius: .8em; background: rgba(255,255,255,.15); border: .12em solid transparent; }
  .diff.sel { background: #4a3a9a; border-color: #ffe14d; }
  .pname { font-weight: 900; font-size: .9em; }
  .pelem { font-size: .65em; opacity: .85; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .55em; width: 100%; max-width: 21em; }
  .lvl { position: relative; height: 6em; border-radius: .8em; padding: .35em .5em; text-align: left; overflow: hidden; box-shadow: 0 .18em 0 rgba(0,0,0,.35); border: .12em solid rgba(255,255,255,.6); }
  .lvl.locked { filter: grayscale(.85) brightness(.6); cursor: default; }
  .lnum { font-size: 1.4em; line-height: 1.1; font-weight: 900; text-shadow: 0 .08em 0 #1b1340, 0 0 .2em #1b1340; }
  .lname { font-size: .72em; font-weight: 800; text-shadow: 0 0 .25em #1b1340, 0 .08em 0 #1b1340; max-width: 6.5em; }
  .lstars { position: absolute; bottom: .25em; left: .5em; color: #ffe14d; font-size: .9em; text-shadow: 0 .08em 0 #1b1340; }
  .lstars span, .stars span { color: rgba(255,255,255,.3); }
  .lboss { position: absolute; right: -.2em; bottom: -.3em; width: 3.6em; height: 3.6em; }
  .stars { font-size: 3em; color: #ffe14d; text-shadow: 0 .06em 0 #b45309; letter-spacing: .1em; min-height: 1em; }
  #resText { margin: 0 0 .4em; font-size: 1.05em; max-width: 18em; }
  .hud-btn { position: absolute; top: 6.2em; width: 2.2em; height: 2.2em; border-radius: 50%; background: rgba(20,12,50,.6); font-size: .95em; z-index: 5; display: flex; align-items: center; justify-content: center; }
  #btnPause { right: .6em; font-weight: 900; }
  #btnMute { right: 3.1em; }
  #btnMusic { right: 5.6em; }
  .hud-btn.off { opacity: .45; text-decoration: line-through; }
  .overlay ~ .hud-btn { z-index: 5; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="menu" class="overlay">
    <h1>Bichitos<br><span>en Ruta</span></h1>
    <p class="sub">Elige tu compañero</p>
    <div id="partners" class="partners"></div>
    <div id="diffRow" class="diffrow"></div>
    <button id="btnPlay" class="big">¡Jugar!</button>
    <p class="tip">Arrastra a izquierda y derecha para elegir puerta. Tus bichitos disparan solos: ¡dispara a las puertas para mejorarlas y a las cajas para conseguir armas!</p>
  </div>

  <div id="levels" class="overlay hidden">
    <h2>Elige nivel</h2>
    <div id="levelGrid" class="grid"></div>
    <button id="btnBack">← Volver</button>
  </div>

  <div id="result" class="overlay hidden">
    <h2 id="resTitle"></h2>
    <div id="resStars" class="stars"></div>
    <p id="resText"></p>
    <button id="btnNext" class="big">Siguiente ▶</button>
    <div class="row"><button id="btnRetry">Reintentar</button><button id="btnLevels">Niveles</button></div>
  </div>

  <div id="pause" class="overlay hidden">
    <h2>Pausa</h2>
    <button id="btnResume" class="big">Seguir</button>
    <button id="btnQuit">Salir al menú</button>
  </div>

  <button id="btnPause" class="hud-btn hidden" aria-label="Pausa">❚❚</button>
  <button id="btnMute" class="hud-btn" aria-label="Sonido">🔊</button>
  <button id="btnMusic" class="hud-btn" aria-label="Música">🎵</button>
</div>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
</body>
</html>
